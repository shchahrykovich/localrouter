[package]
name = "localrouter"
description = "LocalRouter command-line tool and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
localrouter-core.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
thiserror.workspace = true

[dev-dependencies]
# E1d (ADR 06): a local HTTPS server with a test CA plays the internet.
rcgen.workspace = true
rmcp = { version = "3", features = ["client", "transport-child-process"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
rustls.workspace = true
tempfile = "3"
tokio.workspace = true
tokio-rustls.workspace = true
