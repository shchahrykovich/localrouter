[package]
name = "localrouter-core"
description = "Routes, proxy, TLS, TCP byte copy, request log and API types for LocalRouter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Adds X.509 name constraints (only .localhost) to a newly created CA.
# Off until manual test M7 decides open point U1.
name-constraints = []

[dependencies]
bytes.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
percent-encoding.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tower-service.workspace = true
tracing.workspace = true
x509-parser = "0.18"
# Lua 5.4 for script rules (ADR 07): built from source into the binary.
mlua = { version = "0.11", features = ["lua54", "vendored", "send"] }
# Decoding of gzip, deflate, br and zstd bodies for scripts (ADR 07, change 4).
flate2 = "1"
brotli = "8"
zstd = "0.13"
libc.workspace = true
# SHA-256 of a loaded script; ring is already in the tree through rustls.
ring = "0.17"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.30"
futures-util = "0.3"
