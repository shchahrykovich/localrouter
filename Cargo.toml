[workspace]
# Listed one by one: a glob such as apps/* would also match apps/menubar,
# which is a Swift package with no Cargo.toml.
members = ["apps/daemon", "apps/cli", "libs/core"]
resolver = "3"

[workspace.package]
version = "0.1.9"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
localrouter-core = { path = "libs/core" }
anyhow = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2"] }
libc = "0.2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
